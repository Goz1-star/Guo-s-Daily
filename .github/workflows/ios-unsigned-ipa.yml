name: Build iOS IPA for Sideloadly

on:
  workflow_dispatch:
  push:
    paths:
      - "ios-app/**"
      - ".github/workflows/ios-unsigned-ipa.yml"

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ios-app/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: ios-app
        run: npm ci

      - name: Generate native iOS project
        working-directory: ios-app
        run: npx expo prebuild --platform ios --non-interactive

      - name: Build unsigned iPhone app
        working-directory: ios-app
        shell: bash
        run: |
          set -euo pipefail

          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [[ -z "${workspace}" ]]; then
            echo "No Xcode workspace was generated."
            exit 1
          fi

          scheme_file="$(find ios -path '*/xcshareddata/xcschemes/*.xcscheme' -not -path '*/Pods/*' -print -quit)"
          if [[ -z "${scheme_file}" ]]; then
            echo "No application Xcode scheme was found."
            exit 1
          fi
          scheme="$(basename "${scheme_file}" .xcscheme)"
          echo "Using application scheme: ${scheme}"

          set +e
          xcodebuild \
            -workspace "${workspace}" \
            -scheme "${scheme}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO | tee xcodebuild.log
          build_status="${PIPESTATUS[0]}"
          set -e

          if [[ "${build_status}" -ne 0 ]]; then
            error_summary="$(grep -E '(^|[[:space:]])(error:|fatal error:)' xcodebuild.log | tail -n 8 | tr '\n' ' ')"
            echo "::error title=Xcode build failed::${error_summary:-See xcodebuild.log artifact for details.}"
            exit "${build_status}"
          fi

          app_path="$(find build/Build/Products -type d -name '*.app' -print -quit)"
          if [[ -z "${app_path}" ]]; then
            echo "::error title=Missing iOS app::No .app bundle was found after a successful Xcode build."
            exit 1
          fi

          rm -rf Payload
          mkdir Payload
          cp -R "${app_path}" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload GuoDaily-ios-unsigned.ipa

      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: guo-daily-ios-build-log
          path: ios-app/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: guo-daily-ios-unsigned
          path: ios-app/GuoDaily-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
